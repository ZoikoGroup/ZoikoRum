name: Deploy frontend

# Deploys only what passed CI: runs after the CI workflow (ci.yml) finishes on a push to main, and only when it
# succeeded, at the exact commit CI tested. workflow_dispatch stays for a manual (re)deploy of the chosen ref.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY_B64: ${{ secrets.VM_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload to the VM
        working-directory: frontend
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          # New hashed assets first and never delete old ones, so a browser tab still on the old build can load its lazy chunks.
          rsync -az --chmod=D755,F644 dist/assets/ "$VM_USER@$VM_HOST:/var/www/zoikorum-app/assets/"
          # Then index.html and the rest (assets are left alone).
          rsync -az --delete --chmod=D755,F644 --exclude assets dist/ "$VM_USER@$VM_HOST:/var/www/zoikorum-app/"
          # Old assets age out after 30 days.
          ssh "$VM_USER@$VM_HOST" 'find /var/www/zoikorum-app/assets -type f -mtime +30 -delete'

      - name: Health check
        run: curl -fsS -o /dev/null -w "app.zoikorum.com -> %{http_code}\n" https://app.zoikorum.com/
