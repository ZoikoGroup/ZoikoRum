name: Deploy backend

# Deploys only what passed CI: runs after the CI workflow (ci.yml) finishes on a push to main, and only when it
# succeeded, at the exact commit CI tested. workflow_dispatch stays for a manual (re)deploy of the chosen ref.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY_B64: ${{ secrets.VM_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync backend source
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          rsync -az --delete \
            --exclude /.venv --exclude /.env --exclude '/.env.*' --exclude /var \
            --exclude /.deployed-requirements \
            --exclude __pycache__ --exclude '*.pyc' --exclude .pytest_cache \
            backend/ "$VM_USER@$VM_HOST:~/zoikorum-app/backend/"

      # Optional AI settings from one repository secret. The value is a small block of allow-listed KEY=VALUE
      # lines (see the deploy notes). It is piped over SSH on standard input and merged into the server .env
      # before the restart below, so the same deploy keeps the setting. Skipped until ZK_AI_ENV is set.
      - name: Configure AI provider
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          AI_ENV: ${{ secrets.ZK_AI_ENV }}
        run: |
          if [ -z "$AI_ENV" ]; then
            echo "No ZK_AI_ENV secret set; leaving the server AI configuration unchanged."
            exit 0
          fi
          printf '%s\n' "$AI_ENV" | ssh "$VM_USER@$VM_HOST" 'set -e
            cd ~/zoikorum-app/backend
            export PYTHONPATH=$PWD/src
            .venv/bin/python -m zoikorum.ai_env'

      # When the AI settings select Ollama, make sure the local model server and model exist. Skipped for
      # offline/anthropic. The RAM check stops before touching a VM that cannot hold the small model.
      - name: Ensure local AI model (Ollama)
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh "$VM_USER@$VM_HOST" 'set -e
            cd ~/zoikorum-app/backend
            provider=$(sed -n "s/^ZK_AI_PROVIDER=//p" .env | tail -n 1 | tr -d "\r")
            if [ "$provider" != "ollama" ]; then
              echo "Local Ollama not selected (provider=${provider:-unset})."
              exit 0
            fi
            model=$(sed -n "s/^ZK_OLLAMA_MODEL=//p" .env | tail -n 1 | tr -d "\r")
            model=${model:-qwen2.5:0.5b}
            mem_kb=$(awk "/MemAvailable/ {print \$2}" /proc/meminfo)
            if [ "${mem_kb:-0}" -lt 900000 ]; then
              echo "Not enough available memory for ${model} (need at least 900 MB free)."
              exit 1
            fi
            if ! command -v ollama >/dev/null 2>&1; then
              if ! sudo -n true >/dev/null 2>&1; then
                echo "Cannot install Ollama: passwordless sudo is not available."
                exit 1
              fi
              echo "Installing Ollama."
              curl -fsSL https://ollama.com/install.sh | sudo sh
            fi
            sudo systemctl enable --now ollama
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
              sleep 2
            done
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
            ollama pull "$model"
            answer=$(curl -fsS --max-time 120 http://127.0.0.1:11434/api/generate \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$model\",\"prompt\":\"Reply with OK\",\"stream\":false}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get(\"response\", \"\").strip())")
            if [ -z "$answer" ]; then
              echo "Ollama returned an empty answer for ${model}."
              exit 1
            fi
            echo "Ollama ready with ${model}."'

      - name: Dependencies, migrations, restart
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh "$VM_USER@$VM_HOST" 'set -e
            cd ~/zoikorum-app/backend
            if ! cmp -s requirements.txt .deployed-requirements; then
              .venv/bin/pip install -q -r requirements.txt
              cp requirements.txt .deployed-requirements
            fi
            export PYTHONPATH=$PWD/src
            .venv/bin/alembic upgrade head
            sudo systemctl restart zoikorum-api zoikorum-worker'

      # The first staff account (Platform Admin with every staff role), from two repository secrets. Skipped when they
      # are not set. Safe on every deploy: an existing account keeps its password, two-step sign-in and roles.
      # The password goes over SSH on standard input, never on a command line or in the log.
      - name: First staff account
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          ADMIN_EMAIL: ${{ secrets.ZK_BOOTSTRAP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ZK_BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "No first staff account configured (secrets ZK_BOOTSTRAP_ADMIN_EMAIL and ZK_BOOTSTRAP_ADMIN_PASSWORD)."
            exit 0
          fi
          case "$ADMIN_EMAIL" in *[!A-Za-z0-9@._+-]*) echo "ZK_BOOTSTRAP_ADMIN_EMAIL is not a plain email address"; exit 1;; esac
          printf '%s' "$ADMIN_PASSWORD" | ssh "$VM_USER@$VM_HOST" "set -e
            cd ~/zoikorum-app/backend
            export PYTHONPATH=\$PWD/src
            ZK_ADMIN_PASSWORD=\$(cat) .venv/bin/python -m zoikorum.cli create-admin --email '$ADMIN_EMAIL' --name 'Zoikorum Admin' \
              --country IN --roles COMPLIANCE_OFFICER,MEDIATOR,FINANCIAL_OPS,TS_ANALYST,LEGAL"

      - name: Wait for the API to be ready
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS https://api.zoikorum.com/ready | grep -q '"ready"'; then
              echo "API ready"; exit 0
            fi
            sleep 3
          done
          echo "API did not become ready: check journalctl on the VM"; exit 1
