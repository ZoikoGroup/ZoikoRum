# Runs on every push and pull request: backend unit, integration and regression tests + migration drift check;
# frontend lint, unit tests, type-check and build; the deployable images build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zoikorum
          POSTGRES_PASSWORD: zoikorum
          POSTGRES_DB: zoikorum
        ports: ["5434:5432"]  # same port as docker-compose.yml, so the default settings apply
        options: >-
          --health-cmd "pg_isready -U zoikorum" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:  # shared rate-limit tests (tests/test_ratelimit.py)
        image: redis:7-alpine
        ports: ["6380:6379"]  # same port as docker-compose.yml
    defaults:
      run:
        working-directory: backend
    env:
      ZK_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Unit tests (no database)
        run: pytest -m unit
      - name: Integration tests
        run: pytest -m integration
      - name: Regression tests (end-to-end flows, Steps 1-9)
        run: pytest -m regression

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    # The deployable images must build, and the API image must refuse development secrets outside development.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t zoikorum-backend:ci ./backend
      - name: Build web image
        run: docker build -t zoikorum-web:ci ./frontend
      - name: Backend image refuses default secrets in production
        run: |
          if docker run --rm -e ZK_ENV=production zoikorum-backend:ci python -c "from zoikorum.config import get_settings; get_settings()"; then
            echo "The image started with development secrets"; exit 1
          fi

  browser:
    # A real Chrome drives the main journeys (sign-up, search, accept work, PDFs) against the API, worker and a fresh
    # database (frontend/e2e). Traces of failures are kept as an artifact.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zoikorum
          POSTGRES_PASSWORD: zoikorum
          POSTGRES_DB: zoikorum
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U zoikorum" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ZK_E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Install frontend and Chrome
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
