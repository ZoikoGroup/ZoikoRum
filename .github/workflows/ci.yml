# Runs on every push and pull request: backend unit, integration and regression tests + migration drift check;
# frontend lint, unit tests, type-check and build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zoikorum
          POSTGRES_PASSWORD: zoikorum
          POSTGRES_DB: zoikorum
        ports: ["5434:5432"]  # same port as docker-compose.yml, so the default settings apply
        options: >-
          --health-cmd "pg_isready -U zoikorum" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      ZK_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Unit tests (no database)
        run: pytest -m unit
      - name: Integration tests
        run: pytest -m integration
      - name: Regression tests (end-to-end flows, Steps 1-9)
        run: pytest -m regression

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
