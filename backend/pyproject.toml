[project]
name = "zoikorum"
version = "0.1.0"
description = "Zoikorum backend - governed professional services marketplace (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "httpx>=0.27",
    "cryptography>=43",
    "email-validator>=2.2",
    "fpdf2>=2.8",  # server-generated PDFs (contracts, invoices)
    "redis>=5,<7",  # shared rate limits across API processes (ZK_REDIS_URL)
    "prometheus-client>=0.20",  # GET /metrics (shared/metrics.py)
    "webauthn>=2.5,<3",  # passkeys (identity/passkeys.py)
    "signxml>=5.2,<6",  # SAML 2.0 response signatures (identity/saml.py); pure Python on lxml + cryptography wheels
    "lxml>=6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "psycopg[binary]>=3.2"]
kafka = ["aiokafka>=0.11"]
ai = ["anthropic>=1,<2"]  # messages.parse(output_format=...) for the built-in prompts
cloud = ["boto3>=1.35"]  # Amazon S3 storage
gcs = ["google-cloud-storage>=2.18,<4", "google-cloud-kms>=3,<4"]  # Google Cloud Storage + KMS field-key wrapping
monitoring = ["sentry-sdk>=2.0"]
push = ["pywebpush>=2.0,<3"]  # browser push notifications (Web Push with VAPID keys)
tracing = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30",
           "opentelemetry-instrumentation-fastapi>=0.51b0", "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
           "opentelemetry-instrumentation-httpx>=0.51b0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zoikorum = ["shared/fonts/*"]  # PDF fonts (DejaVu, free licence)

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "unit: pure business logic, no database or HTTP (fast)",
    "integration: one feature through the API and a real database",
    "regression: end-to-end business flows across Steps 1-9 (run before every merge)",
]

[tool.coverage.run]
source = ["src/zoikorum"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
skip_empty = true
show_missing = false
